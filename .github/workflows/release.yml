name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04   # pinned: committed outputs are produced on 24.04 (glibc 2.39)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install exact tested versions
        run: pip install -r requirements-dev.txt build
      - name: Tag must equal the package version
        run: |
          v=$(python -c "import pinch; print(pinch.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
