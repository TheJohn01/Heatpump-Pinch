name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04   # pinned: committed outputs are produced on 24.04 (glibc 2.39)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install exact tested versions
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

  outputs-reproducible:
    runs-on: ubuntu-24.04   # pinned: committed outputs are produced on 24.04 (glibc 2.39)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install exact tested versions
        run: pip install -r requirements-dev.txt
      - name: Regenerate outputs and compare with the committed ones (PNG reported, not failed)
        env:
          MPLBACKEND: Agg
        run: python regenerate_outputs.py --check
      - name: Show what changed (only when the check fails)
        if: failure()
        run: |
          git status --short -- outputs
          git diff --stat -- outputs ':!*.png'
          git diff --word-diff=color --unified=0 -- outputs ':!*.png' | head -n 300
