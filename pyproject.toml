[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heatpump-pinch"
version = "0.10.0"
description = "Pinch analysis, heat pump integration and techno-economics for industrial process-heat electrification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tomás Caldas" }]
# Lower bounds = versions the code needs; exact tested versions are pinned in requirements.txt.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pint>=0.24",          # stream data in other units (pinch.units)
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "altair>=5", "reportlab>=4", "python-docx>=1.1", "resvg-py>=0.5"]
report = ["reportlab>=4", "python-docx>=1.1", "resvg-py>=0.5"]   # TEA report (pinch.report_render)
cycle = ["CoolProp>=6.6", "scipy>=1.10"]   # step 4b: working-fluid cycle model
excel = ["openpyxl>=3.1"]                   # stream tables from .xlsx workbooks
rating = ["ht>=1.2", "fluids>=1.3"]         # step 5: shell-and-tube rating (pinch.exchanger_rating)
tespy = ["tespy>=0.12"]                     # steps 4b/6: part load and component cost (pinch.tespy_heat_pump)
prices = ["entsoe-py>=0.8"]                 # step 6: ENTSO-E day-ahead prices (scripts/data)
dev = ["pytest>=8"]

[project.scripts]
heatpump-pinch = "scripts.analysis.analyse:main"

[tool.setuptools]
packages = ["pinch", "scripts", "scripts.analysis"]   # the CLI is scripts/analysis/analyse.py

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes and pycodestyle errors, import order, modern syntax, likely bugs (flake8-bugbear)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B008: defaults built by a call are intended (frozen dataclass defaults); E741: physics symbols (l, I)
ignore = ["B008", "E741", "B905"]   # B905: zip over equal-length sequences by construction

[tool.ruff.lint.per-file-ignores]
# scripts import from the repository root after setting the path
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# Modules checked in CI (tests/test_quality.py); the others carry recorded type debt (docs/QUALITY.md)
