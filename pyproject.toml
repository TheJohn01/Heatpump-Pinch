[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heatpump-pinch"
version = "0.7.0"
description = "Pinch analysis, heat pump integration and techno-economics for industrial process-heat electrification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tomás Caldas" }]
# Lower bounds = versions the code needs; exact tested versions are pinned in requirements.txt.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "altair>=5"]
cycle = ["CoolProp>=6.6", "scipy>=1.10"]   # step 4b: working-fluid cycle model
dev = ["pytest>=8"]

[project.scripts]
heatpump-pinch = "analyse:main"

[tool.setuptools]
packages = ["pinch"]
py-modules = ["analyse"]
