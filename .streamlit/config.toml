# Streamlit configuration of the front end (app.py).
#
# Theme: a Swiss / technical-document style. The colours repeat pinch/theme.py,
# which documents their meaning and the WCAG contrast rules; tests/test_theme.py
# fails if the two drift apart. Red and blue are reserved for physics (hot and
# cold), teal is the interface colour. Users switch light/dark in the app menu
# (Settings > Theme); "Use system setting" follows the operating system.
#
# Fonts: IBM Plex Sans and IBM Plex Mono (SIL Open Font License 1.1, see
# static/fonts/OFL.txt), served by the app itself, so no request goes to a
# third-party font host.

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true

[theme]
font = "IBM Plex Sans, sans-serif"
headingFont = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Italic.woff2"
weight = "400"
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Bold.woff2"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-SemiBold.woff2"
weight = "600"
style = "normal"

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F6"
textColor = "#1F2A30"
borderColor = "#D5DADD"
dataframeBorderColor = "#D5DADD"
primaryColor = "#0B7473"
linkColor = "#0B7473"
redColor = "#C0392B"
blueColor = "#2471A3"
redTextColor = "#C0392B"
blueTextColor = "#2471A3"
chartCategoricalColors = ["#C0392B", "#2471A3", "#1F2A30", "#0B7473", "#B9770E", "#7F8C8D"]
chartSequentialColors = ["#E3F2F1", "#CBE0DF", "#B3CECD", "#9BBCBB", "#83AAA9", "#6A9796", "#528584", "#3A7372", "#226160", "#0A4F4E"]
chartDivergingColors = ["#2471A3", "#4C8AB3", "#74A3C2", "#9CBDD2", "#C4D6E1", "#E3CBC9", "#DAA6A2", "#D2827A", "#C95D53", "#C0392B"]

[theme.light.sidebar]
backgroundColor = "#F3F5F6"

[theme.dark]
backgroundColor = "#11171A"
secondaryBackgroundColor = "#1B2327"
textColor = "#E4E9EB"
borderColor = "#33404A"
dataframeBorderColor = "#33404A"
primaryColor = "#088E82"
linkColor = "#4DB6AC"
redColor = "#EE6C5B"
blueColor = "#5FA8E0"
redTextColor = "#EE6C5B"
blueTextColor = "#5FA8E0"
chartCategoricalColors = ["#EE6C5B", "#5FA8E0", "#E4E9EB", "#4DB6AC", "#E3A33E", "#8E9BA1"]
chartSequentialColors = ["#16403D", "#28524F", "#396461", "#4B7773", "#5D8985", "#6E9B97", "#80ADA9", "#92C0BB", "#A3D2CD", "#B5E4DF"]
chartDivergingColors = ["#5FA8E0", "#5592C0", "#4B7C9F", "#42657F", "#384F5E", "#544344", "#7B4D4A", "#A1584F", "#C86255", "#EE6C5B"]

[theme.dark.sidebar]
backgroundColor = "#1B2327"
